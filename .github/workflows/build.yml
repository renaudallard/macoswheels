name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  linux-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - name: swift build
        run: swift build -v
      - name: swift test
        run: swift test --enable-code-coverage

  lint:
    runs-on: macos-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: swift-format lint
        run: |
          swift format lint --recursive --strict Sources/ Tests/ 2>&1 | tee lint.log
          if [ -s lint.log ]; then
            echo "::warning::swift-format reported lint issues; see job log."
          fi

  mac-build:
    runs-on: macos-latest
    needs: linux-tests
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import signing cert
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_P12_PWD: ${{ secrets.CERT_P12_PWD }}
        run: |
          if [ -n "${CERT_P12_BASE64:-}" ]; then
            bash ci/import-cert.sh
          else
            echo "No signing cert configured; build will be unsigned (dev-only)."
          fi

      - name: Build CLI (validation; DEXT not compilable on stock GitHub macOS runners)
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
        run: |
          xcodebuild -project Macoswheels.xcodeproj \
                     -scheme Macoswheels \
                     -configuration Release \
                     -destination 'platform=macOS' \
                     CODE_SIGNING_ALLOWED=NO \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     CODE_SIGN_ENTITLEMENTS="" \
                     ENTITLEMENTS_REQUIRED=NO \
                     build
          if [ -n "${CERT_P12_BASE64:-}" ]; then
              echo "::warning::Even with signing secrets, the DEXT compile is skipped"
              echo "::warning::because Apple's installed Xcode (26.3 on this runner) doesn't ship a"
              echo "::warning::Swift stdlib for DriverKit yet. See docs/DEV-MODE-SETUP.md."
          fi

      - name: Package artifact
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
        run: |
          if [ -n "${CERT_P12_BASE64:-}" ]; then
              bash ci/sign-and-package.sh MacoswheelsContainer Release
          else
              echo "No signing cert; skipping artifact packaging."
          fi

      - name: Upload
        if: ${{ hashFiles('build/macoswheels-*.zip') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: macoswheels-${{ github.sha }}
          path: build/macoswheels-*.zip
          if-no-files-found: error
