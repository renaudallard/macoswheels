name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.2.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  linux-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"
      - run: swift test

  mac-build:
    runs-on: macos-latest
    needs: linux-tests
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Select latest Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode_*.app 2>/dev/null | sort -V | tail -1)"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Import signing cert (optional)
        env:
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
          CERT_P12_PWD: ${{ secrets.CERT_P12_PWD }}
        run: |
          if [ -n "${CERT_P12_BASE64:-}" ]; then
            bash ci/import-cert.sh
          else
            echo "No Apple Developer cert configured; release artifact will be ad-hoc signed."
          fi

      - name: Build + package
        env:
          DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
          CERT_P12_BASE64: ${{ secrets.CERT_P12_BASE64 }}
        run: bash ci/sign-and-package.sh MacoswheelsContainer Release

      - name: Locate artifact
        id: locate
        run: |
          ZIP="$(ls build/macoswheels-*.zip | head -1)"
          echo "zip=$ZIP" >> "$GITHUB_OUTPUT"
          echo "sha=${ZIP}.sha256" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$ZIP")" >> "$GITHUB_OUTPUT"

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.locate.outputs.name }}
          path: |
            ${{ steps.locate.outputs.zip }}
            ${{ steps.locate.outputs.sha }}
          if-no-files-found: error

      - name: Create or update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ github.event.inputs.tag || github.ref_name }}
          files: |
            ${{ steps.locate.outputs.zip }}
            ${{ steps.locate.outputs.sha }}
          fail_on_unmatched_files: true
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            macoswheels build for ${{ github.event.inputs.tag || github.ref_name }}, built on `macos-latest`.

            **This artifact is unsigned.** Apple's tooling refuses to ad-hoc sign DriverKit DEXTs, and the project doesn't have an Apple Developer Program subscription, so CI cannot produce a signed DEXT. macOS won't load an unsigned DEXT even in dev mode; you'll need to re-sign locally with your own cert before it will work.

            ## Verify

            ```sh
            shasum -a 256 -c macoswheels-${{ github.event.inputs.tag || github.ref_name }}.zip.sha256
            ```

            ## Install (dev-mode Mac required)

            **Easiest path** — build from source with your own free Personal Team:
            ```sh
            git clone https://github.com/renaudallard/macoswheels.git
            cd macoswheels && git checkout ${{ github.event.inputs.tag || github.ref_name }}
            brew install xcodegen && xcodegen generate
            open Macoswheels.xcodeproj   # set Signing & Capabilities -> your Personal Team
            # Build & Run from Xcode, then approve in System Settings -> Privacy & Security
            ```

            **Or** unzip this artifact and re-sign the bundled `.app` with `codesign --force --deep --sign <your-identity>` before running `Tools/dev-load.sh`.

            See `docs/DEV-MODE-SETUP.md` for the one-time `csrutil` and `systemextensionsctl developer on` setup.
